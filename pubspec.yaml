name: my_portfolio
description: "Solodev — Futuristic Cross-Platform Developer & AI Design Portfolio"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Firebase Suite
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.4.4
  firebase_app_check: ^0.3.2+4

  # UI, Icons, Typography & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  font_awesome_flutter: ^11.0.0

  # Media & File Handling (Cross-Platform)
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  image: ^4.5.3
  cached_network_image: ^3.4.1
  video_player: ^2.9.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.5
  cloud_functions: ^5.6.2
  connectivity_plus: ^7.3.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

# ---------------------------------------------------------------------------
# App icon: the Solodev mark, generated for Android (legacy + adaptive + the
# Android 8 launch shape), iOS (full-bleed, alpha removed) and the web
# (favicon + PWA manifest icons). Run: dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Solodev_logo.png"

  # Android adaptive icon: the mark is inset onto the brand background so no
  # part of the artwork is clipped by the launcher's mask.
  adaptive_icon_background: "#0A0E17"
  adaptive_icon_foreground: "assets/images/Solodev_logo.png"
  adaptive_icon_foreground_inset: 18

  # iOS icons must be opaque and fill the canvas, so the transparent PNG is
  # flattened onto the brand background rather than shipped as-is.
  remove_alpha_ios: true
  background_color_ios: "#0A0E17"

  min_sdk_android: 21

  web:
    generate: true
    image_path: "assets/images/Solodev_logo.png"
    background_color: "#0A0E17"
    theme_color: "#0A0E17"

# ---------------------------------------------------------------------------
# Splash screen: the mark on the brand background. `android_12` is declared
# separately because Android 12+ uses the platform splash-screen API.
# Run: dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#0A0E17"
  image: assets/images/solodev_splash_logo.png
  color_dark: "#0A0E17"
  image_dark: assets/images/solodev_splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0A0E17"
    image: assets/images/solodev_splash_logo.png
    color_dark: "#0A0E17"
    image_dark: assets/images/solodev_splash_logo.png
