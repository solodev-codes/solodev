<!DOCTYPE html>

  <meta name="description"

  <meta name="theme-color" content="#1565C0">
  <link rel="canonical" href="https://solodevportfolio.web.app/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Solodev Portfolio">

  <meta property="og:image:alt" content="Solodev portfolio preview">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Solodev">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Structured data for rich search results -->
  <script type="application/ld+json">

    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Solodev",
    "jobTitle": "Flutter Developer & AI Designer",
    "url": "https://solodevportfolio.web.app/",
    "knowsAbout": [
